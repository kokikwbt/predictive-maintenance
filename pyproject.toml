[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdmdata"
version = "0.1.0"
description = "Dataset catalog and Polars loaders for predictive maintenance research"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
  "numpy",
  "scipy",
  "polars",
  "matplotlib",
  "plotly",
  "scikit-learn",
  "kaggle",
  "libarchive-c>=5,<6",
  "h5py>=3.10,<4",
]

[project.optional-dependencies]
jupyter = [
  "jupyterlab",
  "ipykernel",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
]
jupyter = [
  "jupyterlab",
  "ipykernel",
]

[tool.uv]
default-groups = ["dev", "jupyter"]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# Plot helpers zip palettes and axes of intentionally different lengths.
ignore = ["B905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pdmdata.tasks.tte.higs.HigsSpec"]

[tool.setuptools.packages.find]
include = ["pdmdata*"]

[tool.setuptools.package-data]
pdmdata = [
  "README.md",
  "datasets/*/metadata.json",
  "datasets/cwru/recordings.json",
  "datasets/cwru/validation.json",
  "datasets/*/README.md",
  "datasets/*/assets/*.png",
  "datasets/*/assets/*.json",
]

[tool.ruff.lint.isort]
combine-as-imports = true
