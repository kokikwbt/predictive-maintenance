[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdmdata"
version = "0.1.0"
description = "Dataset catalog and Polars loaders for predictive maintenance research"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
  "numpy",
  "scipy",
  "polars",
  "matplotlib",
  "plotly",
  "scikit-learn",
  "kaggle",
  "libarchive-c>=5,<6",
  "h5py>=3.10,<4",
]

[project.optional-dependencies]
jupyter = [
  "jupyterlab",
  "ipykernel",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
]
jupyter = [
  "jupyterlab",
  "ipykernel",
]

[tool.uv]
default-groups = ["dev", "jupyter"]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
# Start with syntax/undefined-name checks; expand gradually.
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.packages.find]
include = ["pdmdata*"]

[tool.setuptools.package-data]
pdmdata = [
  "README.md",
  "datasets/*/metadata.json",
  "datasets/*/README.md",
  "datasets/*/assets/*.png",
  "datasets/*/assets/*.json",
]
